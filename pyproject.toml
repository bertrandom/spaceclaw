[project]
name = "spaceclaw"
version = "2.0.0"
description = "Almost certainly the best Flickr BBS."
readme = "README.md"
authors = [{ name = "Bertrand Fan", email = "bert@bert.org" }]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9",
    "httpx2>=2.16.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
spaceclaw = "spaceclaw.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
